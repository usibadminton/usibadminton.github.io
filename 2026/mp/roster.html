<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>參賽名單 - USI Badminton 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="js/tailwind-config.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-r from-reflected-breeze to-cosmic-sky shadow-lg">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between relative">
      <a href="index.html" class="text-white hover:text-cloud-dancer font-semibold text-lg flex items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </a>
      <h1 class="text-xl md:text-2xl font-bold text-white absolute left-1/2 transform -translate-x-1/2">
        參賽名單
      </h1>
      <div class="w-5"></div>
    </div>
  </nav>

  <!-- Spacer for fixed header -->
  <div class="h-16"></div>

  <div class="max-w-4xl mx-auto p-4 md:p-8">
    <div class="bg-white rounded-lg shadow-lg mb-6">
      <!-- Mode Toggle (Center) - Only show for authenticated users -->
      <div id="modeToggle" class="flex bg-gray-200 rounded-lg p-1 hidden justify-center">
        <button 
          id="checkedModeBtn"
          onclick="switchMode('checked')"
          class="px-4 py-3 rounded-md text-lg font-semibold transition bg-white text-alaskan-blue shadow"
        >
          簽到
        </button>
        <button 
          id="editModeBtn"
          onclick="switchMode('edit')"
          class="px-4 py-3 rounded-md text-lg font-semibold transition text-gray-600"
        >
          編輯
        </button>
      </div>
    </div>

    <!-- Player Count & Mode Toggle -->
    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
      <div class="flex flex-col gap-4">
        <!-- Stats (Center) -->
        <div class="flex gap-6 items-center justify-center">
          <div class="text-center">
            <div class="text-sm text-gray-600">已簽到</div>
            <div id="checkedInCount" class="text-3xl font-bold text-green-600">0</div>
          </div>
          <div class="text-center">
            <div class="text-sm text-gray-600">總人數</div>
            <div id="playerCount" class="text-3xl font-bold text-blue-600">0</div>
          </div>
        </div>
        
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="bg-white rounded-lg shadow-lg p-8">
      <div class="text-center py-8">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-2"></div>
        <div class="text-gray-600">載入名單中...</div>
      </div>
    </div>

    <!-- Search Area (Always visible when players loaded) -->
    <div id="searchArea" class="bg-white rounded-lg shadow-lg p-4 mb-6 hidden">
      <div class="relative">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="搜尋姓名..." 
          oninput="handleSearch()"
          class="w-full pl-10 pr-10 py-3 border-2 border-gray-300 rounded-lg focus:border-alaskan-blue focus:ring-2 focus:ring-reflected-breeze/30 focus:outline-none transition"
        >
        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <button 
          id="clearSearch" 
          onclick="clearSearch()" 
          class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Filter Tabs (Only visible in checked mode) -->
    <div id="filterTabs" class="bg-white rounded-lg shadow-lg p-4 mb-6 hidden">
      <div class="flex gap-2">
        <button 
          id="allPlayersTab"
          onclick="switchFilter('all')"
          class="flex-1 py-2 px-3 rounded-lg font-semibold transition bg-alaskan-blue text-white shadow flex flex-col items-center justify-center gap-1 text-sm"
        >
          <span>全部</span>
          <span id="allCount" class="bg-white text-alaskan-blue px-2 py-0.5 rounded-full text-xs font-bold">0</span>
        </button>
        <button 
          id="uncheckedTab"
          onclick="switchFilter('unchecked')"
          class="flex-1 py-2 px-3 rounded-lg font-semibold transition bg-gray-100 text-gray-600 flex flex-col items-center justify-center gap-1 text-sm"
        >
          <span>未到</span>
          <span id="uncheckedCount" class="bg-gray-300 text-gray-600 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
        </button>
        <button 
          id="checkedTab"
          onclick="switchFilter('checked')"
          class="flex-1 py-2 px-3 rounded-lg font-semibold transition bg-gray-100 text-gray-600 flex flex-col items-center justify-center gap-1 text-sm"
        >
          <span>已到</span>
          <span id="checkedCount" class="bg-gray-300 text-gray-600 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
        </button>
      </div>
    </div>

    <!-- Players List -->
    <div id="playersContainer" class="hidden">
      <div id="playersList" class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
        <!-- 選手列表將動態插入 -->
      </div>
      
      <!-- Add Player Button - Only show for authenticated users -->
      <button 
        onclick="showAddPlayerForm()"
        id="addPlayerBtn"
        class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-lg transition flex items-center justify-center gap-2 hidden"
      >
        <span class="text-xl">+</span>
        <span>新增選手</span>
      </button>
    </div>

  </div>

  <!-- Add/Edit Player Modal -->
  <div id="playerModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-2xl p-6 w-full max-w-md">
      <h3 id="modalTitle" class="text-2xl font-bold mb-4">新增選手</h3>
      
      <form onsubmit="handlePlayerSubmit(event)">
        <div class="mb-4">
          <label for="playerName" class="block text-md font-medium text-gray-700 mb-2">
            姓名
          </label>
          <input 
            type="text" 
            id="playerName" 
            class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 focus:outline-none"
            placeholder="請輸入姓名"
            required
            maxlength="20"
          >
        </div>
        
        <div class="flex gap-3">
          <button 
            type="button"
            onclick="closePlayerModal()"
            class="flex-1 bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 rounded-lg transition"
          >
            取消
          </button>
          <button 
            type="submit"
            class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition"
          >
            確定
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  
  <script>
    let players = [];
    let editingIndex = -1;
    let currentMode = 'checked'; // 'checked' or 'edit'
    let currentFilter = 'all'; // 'all', 'unchecked', or 'checked'
    let searchQuery = ''; // 搜尋關鍵字
    
    // 處理搜尋
    function handleSearch() {
      const searchInput = document.getElementById('searchInput');
      const clearButton = document.getElementById('clearSearch');
      searchQuery = searchInput.value.trim().toLowerCase();
      
      // 顯示/隱藏清除按鈕
      if (searchQuery) {
        clearButton.classList.remove('hidden');
      } else {
        clearButton.classList.add('hidden');
      }
      
      renderPlayers();
    }
    
    // 清除搜尋
    function clearSearch() {
      const searchInput = document.getElementById('searchInput');
      const clearButton = document.getElementById('clearSearch');
      searchInput.value = '';
      searchQuery = '';
      clearButton.classList.add('hidden');
      renderPlayers();
      searchInput.focus();
    }
    
    // 切換篩選
    function switchFilter(filter) {
      currentFilter = filter;
      
      // 更新按鈕樣式
      const allTab = document.getElementById('allPlayersTab');
      const uncheckedTab = document.getElementById('uncheckedTab');
      const checkedTab = document.getElementById('checkedTab');
      
      // 重置所有按鈕樣式
      [allTab, uncheckedTab, checkedTab].forEach(tab => {
        tab.classList.remove('bg-alaskan-blue', 'text-white', 'shadow');
        tab.classList.add('bg-gray-100', 'text-gray-600');
      });
      
      // 設置選中的按鈕樣式
      let activeTab;
      if (filter === 'all') {
        activeTab = allTab;
      } else if (filter === 'unchecked') {
        activeTab = uncheckedTab;
      } else {
        activeTab = checkedTab;
      }
      
      activeTab.classList.remove('bg-gray-100', 'text-gray-600');
      activeTab.classList.add('bg-alaskan-blue', 'text-white', 'shadow');
      
      // 更新徽章顏色
      const allCount = document.getElementById('allCount');
      const uncheckedCount = document.getElementById('uncheckedCount');
      const checkedCount = document.getElementById('checkedCount');
      
      [allCount, uncheckedCount, checkedCount].forEach(badge => {
        badge.classList.remove('bg-white', 'text-alaskan-blue');
        badge.classList.add('bg-gray-300', 'text-gray-600');
      });
      
      if (filter === 'all') {
        allCount.classList.remove('bg-gray-300', 'text-gray-600');
        allCount.classList.add('bg-white', 'text-alaskan-blue');
      } else if (filter === 'unchecked') {
        uncheckedCount.classList.remove('bg-gray-300', 'text-gray-600');
        uncheckedCount.classList.add('bg-white', 'text-alaskan-blue');
      } else {
        checkedCount.classList.remove('bg-gray-300', 'text-gray-600');
        checkedCount.classList.add('bg-white', 'text-alaskan-blue');
      }
      
      // 重新渲染列表
      renderPlayers();
    }
    
    // 切換模式
    function switchMode(mode) {
      currentMode = mode;
      
      // 更新按鈕樣式
      const checkedBtn = document.getElementById('checkedModeBtn');
      const editBtn = document.getElementById('editModeBtn');
      const filterTabs = document.getElementById('filterTabs');
      
      if (mode === 'checked') {
        checkedBtn.classList.add('bg-white', 'text-alaskan-blue', 'shadow');
        checkedBtn.classList.remove('text-gray-600');
        editBtn.classList.remove('bg-white', 'text-alaskan-blue', 'shadow');
        editBtn.classList.add('text-gray-600');
        // 顯示篩選標籤
        filterTabs.classList.remove('hidden');
      } else {
        editBtn.classList.add('bg-white', 'text-alaskan-blue', 'shadow');
        editBtn.classList.remove('text-gray-600');
        checkedBtn.classList.remove('bg-white', 'text-alaskan-blue', 'shadow');
        checkedBtn.classList.add('text-gray-600');
        // 隱藏篩選標籤
        filterTabs.classList.add('hidden');
      }
      
      // 重新渲染列表
      renderPlayers();
    }
    
    // 載入選手列表
    async function loadPlayers() {
      try {
        players = await fetchCSV(CSV_URLS.PLAYERS);
        
        // 移除標題列（如果第一筆是標題）
        if (players.length > 0 && players[0]['name'] === 'name') {
          players.shift();
        }
        
        // 初始化簽到狀態（如果沒有的話）
        players = players.map(p => ({
          'name': p['name'] || '',
          'checked': p['checked'] === 'TRUE' || p['checked'] === true
        }));
        
        hideElement('loading');
        showElement('playersContainer');
        
        // 顯示搜尋區域（兩種模式都需要）
        document.getElementById('searchArea').classList.remove('hidden');
        // 顯示篩選標籤（因為預設是簽到模式）
        document.getElementById('filterTabs').classList.remove('hidden');
        
        // Show edit features only for authenticated users
        if (isAuthenticated()) {
          document.getElementById('modeToggle').classList.remove('hidden');
          document.getElementById('addPlayerBtn').classList.remove('hidden');
        }
        
        renderPlayers();
      } catch (error) {
        console.error('載入選手失敗:', error);
        showToast('載入選手資料失敗', 'error');
      }
    }
    
    // 渲染選手列表
    function renderPlayers() {
      const playersList = document.getElementById('playersList');
      const playerCount = document.getElementById('playerCount');
      const checkedInCount = document.getElementById('checkedInCount');
      
      playerCount.textContent = `${players.length}`;
      
      // 計算簽到人數
      const checkedInPlayers = players.filter(p => p['checked'] === true);
      const uncheckedPlayers = players.filter(p => p['checked'] !== true);
      checkedInCount.textContent = `${checkedInPlayers.length}`;
      
      // 更新篩選標籤的計數
      if (currentMode === 'checked') {
        document.getElementById('allCount').textContent = players.length;
        document.getElementById('uncheckedCount').textContent = uncheckedPlayers.length;
        document.getElementById('checkedCount').textContent = checkedInPlayers.length;
      }
      
      // 根據篩選條件過濾選手
      let filteredPlayers = players;
      if (currentMode === 'checked') {
        if (currentFilter === 'unchecked') {
          filteredPlayers = uncheckedPlayers;
        } else if (currentFilter === 'checked') {
          filteredPlayers = checkedInPlayers;
        }
      }
      
      // 根據搜尋關鍵字過濾
      if (searchQuery) {
        filteredPlayers = filteredPlayers.filter(player => {
          const name = (player['name'] || '').toLowerCase();
          return name.includes(searchQuery);
        });
      }
      
      if (players.length === 0) {
        playersList.innerHTML = `
          <div class="bg-white rounded-lg shadow p-8 text-center text-gray-500 col-span-2">
            尚未新增任何選手<br>
            <span class="text-sm">請點擊下方按鈕新增</span>
          </div>
        `;
        return;
      }
      
      if (filteredPlayers.length === 0) {
        let emptyMessage = '';
        if (searchQuery) {
          emptyMessage = `找不到符合「${searchQuery}」的選手`;
        } else if (currentFilter === 'unchecked') {
          emptyMessage = '所有選手都已簽到！';
        } else if (currentFilter === 'checked') {
          emptyMessage = '尚無選手簽到';
        }
        playersList.innerHTML = `
          <div class="bg-white rounded-lg shadow p-8 text-center text-gray-500 col-span-2">
            ${emptyMessage}
          </div>
        `;
        return;
      }
      
      playersList.innerHTML = filteredPlayers.map((player, originalIndex) => {
        // 找回原始索引
        const index = players.indexOf(player);
        const name = player['name'] || '';
        const checkedIn = player['checked'] === true;
        
        // 根據模式和登入狀態顯示不同的按鈕
        let actionButtons = '';
        if (isAuthenticated()) {
          if (currentMode === 'checked') {
            // 簽到模式：只顯示簽到按鈕
            actionButtons = `
              <button 
                onclick="toggleCheckIn(${index})"
                class="${checkedIn ? 'bg-green-500 hover:bg-green-600' : 'bg-gray-400 hover:bg-gray-500'} text-white w-10 h-10 rounded-full transition flex items-center justify-center"
                title="${checkedIn ? '已簽到' : '點擊簽到'}"
              >
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
              </button>
            `;
          } else {
            // 編輯模式：顯示編輯和刪除按鈕
            actionButtons = `
              <button 
                onclick="editPlayer(${index})"
                class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-2 rounded-2xl transition text-sm font-semibold flex items-center gap-1"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
              </button>
              <button 
                onclick="deletePlayer(${index})"
                class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-2xl transition text-sm font-semibold flex items-center gap-1"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
            `;
          }
        } else {
          // 未登入：顯示簽到狀態（不可點擊）
          actionButtons = `
            <div class="${checkedIn ? 'bg-green-500' : 'bg-gray-400'} text-white w-10 h-10 rounded-full flex items-center justify-center">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
          `;
        }
        
        return `
          <div class="bg-white rounded-lg shadow-md p-4 flex justify-between items-center hover:shadow-lg transition ${checkedIn ? 'border-2 border-green-400' : ''}">
            <div class="flex items-center gap-3">
              <div class="bg-blue-100 text-blue-600 font-bold w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0">
                ${index + 1}
              </div>
              <div class="text-base md:text-lg font-semibold text-gray-800">${name}</div>
              ${checkedIn ? '<span class="text-green-600 font-bold text-xl">✓</span>' : ''}
            </div>
            <div class="flex gap-2">
              ${actionButtons}
            </div>
          </div>
        `;
      }).join('');
      
      // 控制新增按鈕顯示（只在編輯模式顯示）
      const addPlayerBtn = document.getElementById('addPlayerBtn');
      if (currentMode === 'edit' && players.length < CONFIG.MAX_PLAYERS) {
        addPlayerBtn.classList.remove('hidden');
      } else {
        addPlayerBtn.classList.add('hidden');
      }
    }
    
    // 顯示新增選手表單
    function showAddPlayerForm() {
      editingIndex = -1;
      document.getElementById('modalTitle').textContent = '新增選手';
      document.getElementById('playerName').value = '';
      showElement('playerModal');
      document.getElementById('playerName').focus();
    }
    
    // 切換簽到狀態
    function toggleCheckIn(index) {
      players[index]['checked'] = !players[index]['checked'];
      savePlayersToSheet();
      showToast(players[index]['checked'] ? '已簽到' : '已取消', 'success');
    }
    
    // 編輯選手
    function editPlayer(index) {
      editingIndex = index;
      const player = players[index];
      document.getElementById('modalTitle').textContent = '編輯選手';
      document.getElementById('playerName').value = player['name'] || '';
      showElement('playerModal');
      document.getElementById('playerName').focus();
    }
    
    // 刪除選手
    function deletePlayer(index) {
      const player = players[index];
      const name = player['name'] || '';
      
      if (!confirmAction(`確定要刪除「${name}」嗎？`)) {
        return;
      }
      
      players.splice(index, 1);
      savePlayersToSheet();
    }
    
    // 關閉彈窗
    function closePlayerModal() {
      hideElement('playerModal');
      editingIndex = -1;
    }
    
    // 處理表單提交
    function handlePlayerSubmit(event) {
      event.preventDefault();
      
      const name = document.getElementById('playerName').value.trim();
      
      if (!name) {
        showToast('請輸入name', 'warning');
        return;
      }
      
      // 檢查重複
      const isDuplicate = players.some((p, i) => 
        i !== editingIndex && (p['name'] || '') === name
      );
      
      if (isDuplicate) {
        showToast('此姓名已存在', 'warning');
        return;
      }
      
      if (editingIndex >= 0) {
        // 編輯
        players[editingIndex]['name'] = name;
        showToast('選手資料已更新', 'success');
      } else {
        // 新增
        if (players.length >= CONFIG.MAX_PLAYERS) {
          showToast(`已達${CONFIG.MAX_PLAYERS}人上限`, 'warning');
          closePlayerModal();
          return;
        }
        players.push({ 
          'name': name,
          'checked': false 
        });
        showToast('選手已新增', 'success');
      }
      
      closePlayerModal();
      savePlayersToSheet();
    }
    
    // 儲存到 Google Sheets
    async function savePlayersToSheet() {
      try {
        // 先更新 UI
        renderPlayers();
        
        // 寫入 Google Sheets
        console.log('CONFIG.SCRIPT_URL:', CONFIG.SCRIPT_URL);
        if (CONFIG.SCRIPT_URL && CONFIG.SCRIPT_URL.trim() !== '') {
          await writeToSheet('updatePlayers', players);
          showToast('資料已同步', 'info');
        } else {
          console.warn('Google Apps Script 尚未設定，資料僅在本地更新');
          showToast('⚠️ 資料僅暫存，尚未同步', 'warning', 5000);
        }
      } catch (error) {
        console.error('儲存失敗:', error);
        showToast('❌ 儲存失敗：' + error.message, 'error');
      }
    }
    
    // 點擊背景關閉彈窗
    document.getElementById('playerModal').addEventListener('click', (e) => {
      if (e.target.id === 'playerModal') {
        closePlayerModal();
      }
    });
    
    // ESC 關閉彈窗
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closePlayerModal();
      }
    });
    
    // 初始化
    loadPlayers();
  </script>

</body>
</html>
