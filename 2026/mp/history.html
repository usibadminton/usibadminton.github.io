<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歷史查詢 - USI Badminton 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="js/tailwind-config.js"></script>
  <style>
    .tab-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .tab-btn:not(.active) {
      background: #f3f4f6;
      color: #6b7280;
    }
    .tab-btn:not(.active):hover {
      background: #e5e7eb;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-r from-reflected-breeze to-cosmic-sky shadow-lg">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between relative">
      <a href="index.html" class="text-white hover:text-cloud-dancer font-semibold text-lg flex items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </a>
      <h1 class="text-xl md:text-2xl font-bold text-white absolute left-1/2 transform -translate-x-1/2 flex items-center gap-2">
        <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
        </svg>
        歷史查詢
      </h1>
      <div class="w-5"></div>
    </div>
  </nav>

  <!-- Spacer for fixed header -->
  <div class="h-16"></div>

  <div class="max-w-6xl mx-auto p-4 md:p-8">
    
    <!-- Round Info -->
    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <h2 id="roundTitle" class="text-2xl font-bold text-gray-800">場次 Match-001</h2>
          <p id="roundDate" class="text-sm text-gray-600 mt-1">📅 2026-01-01</p>
          <p id="roundNote" class="text-sm text-gray-600">第 1 次比賽</p>
        </div>
        <div class="flex gap-2">
          <div class="text-center px-4 py-2 bg-gray-50 rounded-lg border border-gray-300">
            <div id="teamAWinLabel" class="text-xs text-gray-600">TeamA</div>
            <div id="spadeWins" class="text-2xl font-bold text-gray-700">0</div>
          </div>
          <div class="text-center px-4 py-2 bg-red-50 rounded-lg border border-red-200">
            <div id="teamBWinLabel" class="text-xs text-gray-600">TeamB</div>
            <div id="heartWins" class="text-2xl font-bold text-red-600">0</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="bg-white rounded-lg shadow-lg p-8">
      <div class="text-center py-8">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-teal-600 mb-2"></div>
        <div class="text-gray-600">載入歷史資料...</div>
      </div>
    </div>

    <!-- Tabs -->
    <div id="contentTabs" class="hidden">
      <div class="bg-white rounded-lg shadow-lg p-4 mb-6">
        <div class="grid grid-cols-3 gap-2">
          <button 
            onclick="switchTab('teams')"
            id="teamsTab"
            class="tab-btn py-3 px-4 rounded-lg font-bold transition active flex items-center justify-center gap-2"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            分組結果
          </button>
          <button 
            onclick="switchTab('matches')"
            id="matchesTab"
            class="tab-btn py-3 px-4 rounded-lg font-bold transition flex items-center justify-center gap-2"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
            </svg>
            賽程表
          </button>
          <button 
            onclick="switchTab('scores')"
            id="scoresTab"
            class="tab-btn py-3 px-4 rounded-lg font-bold transition flex items-center justify-center gap-2"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
            </svg>
            比分紀錄
          </button>
        </div>
      </div>

      <!-- Tab Content -->
      <div id="tabContent">
        
        <!-- Tab 1: 分組結果 -->
        <div id="teamsContent" class="tab-content">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- TeamA -->
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
              <div class="bg-blue-600 text-white px-6 py-4">
                <h3 id="teamATeamHeader" class="text-xl font-bold text-center">♠ TeamA</h3>
              </div>
              <div id="spadeTeamList" class="p-6 space-y-2">
                <!-- TeamA名單將動態插入 -->
              </div>
            </div>

            <!-- TeamB -->
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
              <div class="bg-red-600 text-white px-6 py-4">
                <h3 id="teamBTeamHeader" class="text-xl font-bold text-center">♥ TeamB</h3>
              </div>
              <div id="heartTeamList" class="p-6 space-y-2">
                <!-- TeamB名單將動態插入 -->
              </div>
            </div>

          </div>
        </div>

        <!-- Tab 2: 賽程表 -->
        <div id="matchesContent" class="tab-content hidden">
          <div id="matchesList" class="space-y-4">
            <!-- 賽程列表將動態插入 -->
          </div>
        </div>

        <!-- Tab 3: 比分紀錄 -->
        <div id="scoresContent" class="tab-content hidden">
          <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
              <h3 class="text-lg font-bold text-gray-800">篩選局數：</h3>
              <select 
                id="matchFilter" 
                onchange="filterScores()"
                class="px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-teal-500 focus:ring-2 focus:ring-teal-200 focus:outline-none"
              >
                <option value="all">所有局數</option>
                <option value="1">局數 1</option>
                <option value="2">局數 2</option>
                <option value="3">局數 3</option>
                <option value="4">局數 4</option>
                <option value="5">局數 5</option>
                <option value="6">局數 6</option>
              </select>
            </div>
          </div>
          <div id="scoresList" class="space-y-3">
            <!-- 比分列表將動態插入 -->
          </div>
        </div>

      </div>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  
  <script>
    let roundId = '';
    let teams = { spade: [], heart: [] };
    let matches = [];
    let scores = [];
    let currentTab = 'teams';
    
    // 初始化
    async function init() {
      roundId = getUrlParam('round') || 'Match-001';
      document.getElementById('roundTitle').textContent = `場次 ${roundId}`;
      
      // 載入隊伍名稱並更新 UI
      await loadTeamNames();
      const teamAName = getTeamName('teamA');
      const teamBName = getTeamName('teamB');
      
      // 更新頁面中隊伍名稱標籤
      document.getElementById('teamAWinLabel').textContent = teamAName;
      document.getElementById('teamBWinLabel').textContent = teamBName;
      document.getElementById('teamATeamHeader').textContent = `♠ ${teamAName}`;
      document.getElementById('teamBTeamHeader').textContent = `♥ ${teamBName}`;
      
      await loadRoundInfo();
      await loadTeams();
      await loadMatches();
      await loadScores();
      
      renderTeams();
      renderMatches();
      renderScores();
      updateWinCounts();
      
      hideElement('loading');
      showElement('contentTabs');
    }
    
    // 載入場次資訊
    async function loadRoundInfo() {
      try {
        const rounds = await fetchCSV(CSV_URLS.ROUNDS);
        const round = rounds.find(r => r['matchID'] === roundId);
        
        if (round) {
          document.getElementById('roundDate').textContent = `📅 ${round['time'] || ''}`;
          document.getElementById('roundNote').textContent = round['note'] || '';
        }
      } catch (error) {
        console.error('載入場次資訊失敗:', error);
      }
    }
    
    // 載入分組
    async function loadTeams() {
      try {
        const data = await fetchCSV(CSV_URLS.TEAMS);
        const roundTeams = data.filter(t => t['matchID'] === roundId);
        
        // 取得當前的隊伍名稱設定
        const teamAName = getTeamName('teamA');
        const teamBName = getTeamName('teamB');
        
        teams.teamA = roundTeams
          .filter(t => t['team'] === teamAName || t['team'] === '黑桃' || t['team'] === 'Team A')
          .sort((a, b) => parseInt(a['no']) - parseInt(b['no']));
        
        teams.teamB = roundTeams
          .filter(t => t['team'] === teamBName || t['team'] === '紅心' || t['team'] === 'Team B')
          .sort((a, b) => parseInt(a['no']) - parseInt(b['no']));
      } catch (error) {
        console.error('載入分組失敗:', error);
      }
    }
    
    // 載入賽程
    async function loadMatches() {
      try {
        const data = await fetchCSV(CSV_URLS.MATCHES);
        matches = data.filter(m => m['matchID'] === roundId);
      } catch (error) {
        console.error('載入賽程失敗:', error);
      }
    }
    
    // 載入比分
    async function loadScores() {
      try {
        const data = await fetchCSV(CSV_URLS.SCORES);
        scores = data.filter(s => s['matchID'] === roundId);
      } catch (error) {
        console.error('載入比分失敗:', error);
        scores = [];
      }
    }
    
    // 渲染分組
    function renderTeams() {
      const spadeList = document.getElementById('spadeTeamList');
      const heartList = document.getElementById('heartTeamList');
      
      spadeList.innerHTML = teams.spade.map((player, index) => `
        <div class="flex items-center gap-3 bg-blue-50 px-4 py-3 rounded-lg">
          <div class="bg-blue-100 text-blue-600 font-bold w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0">
            ${index + 1}
          </div>
          <div class="text-lg font-semibold text-gray-800">${player['name'] || '---'}</div>
        </div>
      `).join('');
      
      heartList.innerHTML = teams.heart.map((player, index) => `
        <div class="flex items-center gap-3 bg-red-50 px-4 py-3 rounded-lg">
          <div class="bg-red-100 text-red-600 font-bold w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0">
            ${index + 1}
          </div>
          <div class="text-lg font-semibold text-gray-800">${player['name'] || '---'}</div>
        </div>
      `).join('');
    }
    
    // 渲染賽程
    function renderMatches() {
      const matchesList = document.getElementById('matchesList');
      
      // 獲取隊伍名稱
      const teamAName = getTeamName('teamA');
      const teamBName = getTeamName('teamB');
      
      matchesList.innerHTML = matches.map((match, index) => {
        const matchNumber = match['game'] || (index + 1);
        const spade1 = match['teamA_1'] || '---';
        const spade2 = match['teamA_2'] || '---';
        const heart1 = match['teamB_1'] || '---';
        const heart2 = match['teamB_2'] || '---';
        
        // 找出比分
        const score = scores.find(s => parseInt(s['game']) === parseInt(matchNumber));
        const hasScore = !!score;
        const spadeScore = hasScore ? score['teamA_score'] : '-';
        const heartScore = hasScore ? score['teamB_score'] : '-';
        
        let winner = '';
        if (hasScore) {
          winner = parseInt(spadeScore) > parseInt(heartScore) ? 'teamA' : 'teamB';
        }
        
        return `
          <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <div class="bg-gradient-to-r from-purple-500 to-purple-600 text-white px-6 py-3">
              <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold">局數 ${matchNumber}</h3>
                ${hasScore ? `
                  <div class="flex items-center gap-2">
                    <span class="bg-white text-purple-600 px-3 py-1 rounded font-bold">
                      ${spadeScore} - ${heartScore}
                    </span>
                  </div>
                ` : `
                  <span class="bg-purple-400 px-3 py-1 rounded text-sm">未計分</span>
                `}
              </div>
            </div>
            
            <div class="p-6">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- TeamA -->
                <div class="bg-gray-50 rounded-lg p-4 border-2 ${winner === 'teamA' ? 'border-gray-700' : 'border-gray-300'}">
                  <div class="flex items-center justify-between mb-3">
                    <div class="text-lg font-bold text-gray-700">♠ ${teamAName}</div>
                    ${winner === 'teamA' ? '<div class="text-2xl">🏆</div>' : ''}
                  </div>
                  <div class="space-y-2">
                    <div class="bg-white px-3 py-2 rounded text-gray-800">${spade1}</div>
                    <div class="bg-white px-3 py-2 rounded text-gray-800">${spade2}</div>
                  </div>
                </div>
                
                <!-- TeamB -->
                <div class="bg-red-50 rounded-lg p-4 border-2 ${winner === 'teamB' ? 'border-red-500' : 'border-red-200'}">
                  <div class="flex items-center justify-between mb-3">
                    <div class="text-lg font-bold text-red-600">♥ ${teamBName}</div>
                    ${winner === 'teamB' ? '<div class="text-2xl">🏆</div>' : ''}
                  </div>
                  <div class="space-y-2">
                    <div class="bg-white px-3 py-2 rounded text-gray-800">${heart1}</div>
                    <div class="bg-white px-3 py-2 rounded text-gray-800">${heart2}</div>
                  </div>
                </div>
                
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // 渲染比分
    function renderScores() {
      const scoresList = document.getElementById('scoresList');
      
      if (scores.length === 0) {
        scoresList.innerHTML = `
          <div class="bg-white rounded-lg shadow p-8 text-center text-gray-500">
            尚未記錄任何比分
          </div>
        `;
        return;
      }
      
      scoresList.innerHTML = scores.map(score => {
        const matchNumber = score['game'];
        const spadeScore = score['teamA_score'];
        const heartScore = score['teamB_score'];
        const timestamp = score['time'] || '';
        const winner = parseInt(spadeScore) > parseInt(heartScore) ? 'teamA' : 'teamB';
        
        return `
          <div class="bg-white rounded-lg shadow-lg p-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div class="flex items-center gap-4">
                <div class="bg-purple-100 text-purple-600 font-bold w-12 h-12 rounded-full flex items-center justify-center text-lg">
                  ${matchNumber}
                </div>
                <div>
                  <div class="text-2xl font-bold">
                    <span class="${winner === 'teamA' ? 'text-gray-700' : 'text-gray-600'}">♠ ${spadeScore}</span>
                    <span class="mx-2 text-gray-400">-</span>
                    <span class="${winner === 'teamB' ? 'text-red-600' : 'text-gray-600'}">♥ ${heartScore}</span>
                  </div>
                  <div class="text-sm text-gray-500 mt-1">
                    🏆 ${winner === 'teamA' ? getTeamName('teamA') : getTeamName('teamB')} 獲勝
                  </div>
                </div>
              </div>
              <div class="text-sm text-gray-500">
                ${timestamp}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // 篩選比分
    function filterScores() {
      const filter = document.getElementById('matchFilter').value;
      const scoresList = document.getElementById('scoresList');
      
      let filteredScores = scores;
      if (filter !== 'all') {
        filteredScores = scores.filter(s => s['game'] === filter);
      }
      
      if (filteredScores.length === 0) {
        scoresList.innerHTML = `
          <div class="bg-white rounded-lg shadow p-8 text-center text-gray-500">
            此局數尚未記錄比分
          </div>
        `;
        return;
      }
      
      scoresList.innerHTML = filteredScores.map(score => {
        const matchNumber = score['game'];
        const spadeScore = score['teamA_score'];
        const heartScore = score['teamB_score'];
        const timestamp = score['time'] || '';
        const winner = parseInt(spadeScore) > parseInt(heartScore) ? 'teamA' : 'teamB';
        
        return `
          <div class="bg-white rounded-lg shadow-lg p-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div class="flex items-center gap-4">
                <div class="bg-purple-100 text-purple-600 font-bold w-12 h-12 rounded-full flex items-center justify-center text-lg">
                  ${matchNumber}
                </div>
                <div>
                  <div class="text-2xl font-bold">
                    <span class="${winner === 'teamA' ? 'text-gray-700' : 'text-gray-600'}">♠ ${spadeScore}</span>
                    <span class="mx-2 text-gray-400">-</span>
                    <span class="${winner === 'teamB' ? 'text-red-600' : 'text-gray-600'}">♥ ${heartScore}</span>
                  </div>
                  <div class="text-sm text-gray-500 mt-1">
                    🏆 ${winner === 'teamA' ? getTeamName('teamA') : getTeamName('teamB')} 獲勝
                  </div>
                </div>
              </div>
              <div class="text-sm text-gray-500">
                ${timestamp}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // 更新勝場數
    function updateWinCounts() {
      let spadeWins = 0;
      let heartWins = 0;
      
      scores.forEach(score => {
        const spadeScore = parseInt(score['teamA_score']);
        const heartScore = parseInt(score['teamB_score']);
        
        if (spadeScore > heartScore) {
          spadeWins++;
        } else {
          heartWins++;
        }
      });
      
      document.getElementById('spadeWins').textContent = spadeWins;
      document.getElementById('heartWins').textContent = heartWins;
    }
    
    // 切換標籤
    function switchTab(tab) {
      currentTab = tab;
      
      // 更新標籤樣式
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.getElementById(tab + 'Tab').classList.add('active');
      
      // 切換內容
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.add('hidden');
      });
      document.getElementById(tab + 'Content').classList.remove('hidden');
    }
    
    // 初始化
    init();
  </script>

</body>
</html>
