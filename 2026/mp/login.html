<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USI Badminton 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
</head>
<body class="bg-gradient-to-br from-white via-cloud-dancer/50 to-reflected-breeze/20 min-h-screen flex items-center justify-center p-4">
  
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-block bg-gradient-to-r from-reflected-breeze to-cosmic-sky text-white rounded-full p-4 mb-4">
        <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-gray-800 mb-2">管理員登入</h1>
      <p class="text-gray-600">USI Badminton 2026</p>
    </div>
    
    <!-- Login Form -->
    <form onsubmit="handleLogin(event)" class="space-y-6">
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
          密碼
        </label>
        <input 
          type="password" 
          id="password" 
          class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-alaskan-blue focus:ring-2 focus:ring-reflected-breeze/30 focus:outline-none transition"
          placeholder="請輸入管理員密碼"
          required
          autocomplete="current-password"
        >
      </div>
      
      <!-- Error Message -->
      <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
        密碼錯誤，請重試
      </div>
      
      <!-- Submit Button -->
      <button 
        type="submit"
        class="w-full bg-gradient-to-r from-reflected-breeze to-cosmic-sky hover:from-alaskan-blue hover:to-cosmic-sky text-white font-bold py-3 px-6 rounded-lg transition transform hover:scale-105 active:scale-95"
      >
        登入
      </button>
    </form>
    
    <!-- Back to Home -->
    <div class="mt-2 text-center">
      <a href="index.html" class="inline-flex items-center justify-center gap-2 w-full bg-gradient-to-r from-gray-500 to-gray-600 hover:from-gray-600 hover:to-gray-700 text-white font-bold py-3 px-6 rounded-lg transition transform hover:scale-105 active:scale-95">
        返回首頁
      </a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  
  <script>
    // 如果已經登入，直接跳轉
    if (isAuthenticated()) {
      window.location.href = 'index.html';
    }
    
    function handleLogin(event) {
      event.preventDefault();
      
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      
      if (login(password)) {
        // 登入成功
        window.location.href = 'roster.html';
      } else {
        // 登入失敗
        errorMessage.classList.remove('hidden');
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
        
        // 3秒後隱藏錯誤訊息
        setTimeout(() => {
          errorMessage.classList.add('hidden');
        }, 3000);
      }
    }
    
    // Enter 鍵送出表單
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleLogin(e);
      }
    });
  </script>
</body>
</html>
