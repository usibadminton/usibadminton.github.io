<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USI Badminton 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="js/tailwind-config.js"></script>
</head>
<body class="bg-gradient-to-br from-white via-cloud-dancer/50 to-reflected-breeze/20 min-h-screen">

  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-r from-reflected-breeze to-cosmic-sky text-cloud-dancer shadow-lg">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-center relative">
      <div id="settingsBtn" class="absolute left-4 top-1/2 -translate-y-1/2" style="display: none;">
        <!-- 設定按鈕 -->
      </div>
      <div class="text-center">
        <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white">2025 歲末年終友誼盃</h1>
      </div>
      <div id="authStatus" class="absolute right-4 top-1/2 -translate-y-1/2 text-right text-xs">
        <!-- 登入狀態將動態顯示 -->
      </div>
    </div>
  </header>

  <!-- Spacer for fixed header -->
  <div class="h-16"></div>

  <div class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- Action Buttons -->
    <div id="actionButtonsContainer" class="grid grid-cols-3 gap-3 md:gap-4 mb-8 max-w-3xl mx-auto">
      
      <!-- 參賽名單 (所有人可見) -->
      <button 
        onclick="navigateToRoster()"
        class="bg-white/70 hover:bg-scuba-plunge/10 border-2 border-scuba-plunge/60 text-scuba-plunge/60 hover:text-scuba-plunge font-medium py-4 px-4 rounded-xl transition-all duration-300 transform active:scale-95 shadow-md hover:shadow-lg backdrop-blur-sm"
      >
        <div class="mb-2 flex justify-center">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
          </svg>
        </div>
        <div class="text-base md:text-lg font-bold tracking-wide">參賽名單</div>
        <div class="text-xs md:text-sm text-gray-600 mt-1 font-light">查看/簽到</div>
      </button>
      
      <!-- 比賽列表 (所有人可見) -->
      <button 
        onclick="navigateToMatchList()"
        class="bg-white/70 hover:bg-scuba-plunge/10 border-2 border-scuba-plunge/60 text-scuba-plunge/60 hover:text-scuba-plunge font-medium py-4 px-4 rounded-xl transition-all duration-300 transform active:scale-95 shadow-md hover:shadow-lg backdrop-blur-sm"
      >
        <div class="mb-2 flex justify-center">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
          </svg>
        </div>
        <div class="text-base md:text-lg font-bold tracking-wide">比賽列表</div>
        <div class="text-xs md:text-sm text-gray-600 mt-1 font-light">場次/統計</div>
      </button>
      
      <!-- 訂餐資訊 (所有人可見) -->
      <button 
        onclick="navigateToOrder()"
        class="bg-white/70 hover:bg-scuba-plunge/10 border-2 border-scuba-plunge/60 text-scuba-plunge/60 hover:text-scuba-plunge font-medium py-4 px-4 rounded-xl transition-all duration-300 transform active:scale-95 shadow-md hover:shadow-lg backdrop-blur-sm"
      >
        <div class="mb-2 flex justify-center">
          <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 640 640">
            <path d="M127.9 78.4C127.1 70.2 120.2 64 112 64C103.8 64 96.9 70.2 96 78.3L81.9 213.7C80.6 219.7 80 225.8 80 231.9C80 277.8 115.1 315.5 160 319.6L160 544C160 561.7 174.3 576 192 576C209.7 576 224 561.7 224 544L224 319.6C268.9 315.5 304 277.8 304 231.9C304 225.8 303.4 219.7 302.1 213.7L287.9 78.3C287.1 70.2 280.2 64 272 64C263.8 64 256.9 70.2 256.1 78.4L242.5 213.9C241.9 219.6 237.1 224 231.4 224C225.6 224 220.8 219.6 220.2 213.8L207.9 78.6C207.2 70.3 200.3 64 192 64C183.7 64 176.8 70.3 176.1 78.6L163.8 213.8C163.3 219.6 158.4 224 152.6 224C146.8 224 142 219.6 141.5 213.9L127.9 78.4zM512 64C496 64 384 96 384 240L384 352C384 387.3 412.7 416 448 416L480 416L480 544C480 561.7 494.3 576 512 576C529.7 576 544 561.7 544 544L544 96C544 78.3 529.7 64 512 64z"/>
          </svg>
        </div>
        <div class="text-base md:text-lg font-bold tracking-wide">訂餐資訊</div>
        <div class="text-xs md:text-sm text-gray-600 mt-1 font-light">-</div>
      </button>
      
    </div>
    
    <!-- Announcement Section -->
    <div id="announcementSection" class="bg-gradient-to-br from-slate-50 via-blue-50/40 to-indigo-50/60 border-l-4 md:border-2 md:border-l-0 border-slate-300 md:border-slate-300/60 rounded-xl md:rounded-2xl shadow-md md:shadow-xl p-4 md:p-6 mb-8 backdrop-blur-sm">
      <div class="flex items-center justify-between gap-3 md:gap-4 mb-2 md:mb-3 pb-2 border-b border-slate-200">
        <div class="flex items-center gap-3 md:gap-4">
          <div class="flex-shrink-0">
            <svg class="w-6 h-6 md:w-8 md:h-8 text-slate-600" fill="currentColor" viewBox="0 0 24 24">
              <path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>
            </svg>
          </div>
          <h2 class="text-lg md:text-xl font-bold text-slate-700">
            公告
          </h2>
        </div>
        <button onclick="toggleAnnouncement()" id="announcementToggle" class="text-slate-500 hover:text-slate-700 transition p-1">
          <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>
      </div>
      <div id="announcementContent" class="text-base md:text-lg text-slate-700 pl-2" style="display: block;">
        <!-- 載入中 -->
        <div class="text-center py-4">
          <div class="inline-block animate-spin rounded-full h-6 w-6 border-b-2 border-slate-400"></div>
          <p class="text-sm text-slate-500 mt-2">載入公告中...</p>
        </div>
      </div>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  
  <script>
    // 顯示登入狀態
    function updateAuthStatus() {
      const authStatus = document.getElementById('authStatus');
      
      if (isAuthenticated()) {
        const remaining = getRemainingAuthTime();
        
        // 顯示設定按鈕（左側）
        const settingsBtn = document.getElementById('settingsBtn');
        settingsBtn.style.display = 'block';
        settingsBtn.innerHTML = `
          <a href="settings.html" class="hover:bg-white/30 text-white text-sm px-3 py-3 rounded-3xl transition font-medium inline-flex items-center gap-1">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <span class="hidden md:inline"></span>
          </a>
        `;
        
        // 登出按鈕（右側）
        authStatus.innerHTML = `
          <div class="flex flex-col md:gap-1 items-end justify-center">
            <button onclick="handleLogout()" class="bg-white/20 hover:bg-white/30 text-white text-sm px-3 py-1.5 rounded-3xl transition font-medium">
              登出
            </button>
            <div class="hidden md:block text-xs text-cloud-dancer/80 font-light">
            ${remaining}
            </div>
          </div>
        `;
      } else {
        // 隱藏設定按鈕
        document.getElementById('settingsBtn').style.display = 'none';
        
        authStatus.innerHTML = `
          <a href="login.html" class="bg-white/20 hover:bg-white/30 text-white text-xs px-3 py-1.5 rounded-lg transition font-medium inline-block">
            登入
          </a>
        `;
      }
    }
    
    // 登出
    async function handleLogout() {
      const confirmed = await confirmAction('確定要登出嗎？');
      if (confirmed) {
        logout();
        showToast('已登出', 'success');
        updateAuthStatus();
      }
    }
    
    // 導航到名單管理（所有人可見）
    function navigateToRoster() {
      window.location.href = 'roster.html';
    }
    
    // 導航到比賽列表（所有人可見）
    function navigateToMatchList() {
      window.location.href = 'matchlist.html';
    }
    
    // 導航到訂餐資訊（所有人可見）
    function navigateToOrder() {
      window.location.href = 'order.html';
    }
    
    // Toggle 公告顯示/隱藏
    function toggleAnnouncement() {
      const content = document.getElementById('announcementContent');
      const toggle = document.getElementById('announcementToggle');
      const svg = toggle.querySelector('svg');
      
      if (content.style.display === 'none') {
        content.style.display = 'block';
        svg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>';
      } else {
        content.style.display = 'none';
        svg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>';
      }
    }
    
    // 載入公告
    async function loadAnnouncements() {
      try {
        // 檢查是否設定了 GID
        if (!CONFIG.GID.ANNOUNCEMENTS) {
          // 如果沒設定，顯示預設內容
          displayDefaultAnnouncement();
          return;
        }
        
        const announcements = await fetchCSV(CSV_URLS.ANNOUNCEMENTS);
        
        if (announcements.length === 0) {
          displayDefaultAnnouncement();
          return;
        }
        
        const contentDiv = document.getElementById('announcementContent');
        let html = '';
        
        // 讀取分組資訊
        const groups = [];
        let currentGroup = null;
        
        announcements.forEach(row => {
          const groupTitle = row['topic'];
          const label = row['title'];
          const value = row['content'];
          
          // 如果有分組標題，開始新分組
          if (groupTitle && groupTitle.trim()) {
            if (currentGroup) {
              groups.push(currentGroup);
            }
            currentGroup = {
              title: groupTitle.trim() === '-' ? '' : groupTitle.trim(), // '-' 表示只要分隔線，不顯示標題
              items: []
            };
          }
          
          // 如果有內容，加入當前分組
          if (label && value && currentGroup) {
            currentGroup.items.push({
              label: label.trim(),
              value: value.trim()
            });
          }
        });
        
        // 加入最後一個分組
        if (currentGroup && currentGroup.items.length > 0) {
          groups.push(currentGroup);
        }
        
        // 渲染分組
        groups.forEach((group, index) => {
          // 分組標題（如果有的話）- 在區塊外
          if (group.title) {
            html += `<div class="text-lg font-bold text-scuba-plunge mt-4 mb-2">${group.title}</div>`;
          }
          
          // 分組容器
          html += `<div class="space-y-1 bg-white/60 p-2 md:p-3 rounded-2xl">`;
          
          // 分組項目
          group.items.forEach(item => {
            html += `
              <div class="leading-relaxed" style="display: grid; grid-template-columns: 5em 1fr; gap: 0.5rem; align-items: start;">
                
                <span class="font-semibold text-gray-800">
                <span class="text-scuba-plunge font-bold flex-shrink-0 text-sm md:text-base mr-2">•</span>${item.label}</span>
                <span class="whitespace-pre-wrap break-words">${item.value}</span>
              </div>
            `;
          });
          
          html += '</div>';
          
          // 在區塊之間加分隔線（除了最後一組）
          if (index < groups.length - 1) {
            html += `<div class="m-4 border-t-2 border-cyan-300"></div>`;
          }
        });
        
        contentDiv.innerHTML = html || '<p class="text-gray-500">暫無公告</p>';
        
      } catch (error) {
        console.error('載入公告失敗:', error);
        displayDefaultAnnouncement();
      }
    }
    
    // 顯示預設公告（後備方案）
    function displayDefaultAnnouncement() {
      const contentDiv = document.getElementById('announcementContent');
      contentDiv.innerHTML = '<p class="text-gray-500">暫無公告</p>';
    }
    
    // 建立新場次（需要登入）
    async function createNewRound() {
      if (!isAuthenticated()) {
        showToast('請先登入', 'warning');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1000);
        return;
      }
      
      // 取得當前場次數量
      try {
        const rounds = await fetchCSV(CSV_URLS.ROUNDS);
        const nextNumber = rounds.length + 1;
        const roundId = generateRoundId(nextNumber);
        
        // 跳轉到分組頁面
        window.location.href = `team-assign.html?round=${roundId}&new=true`;
      } catch (error) {
        console.error('建立場次失敗:', error);
        // 如果讀取失敗，假設是第一場
        window.location.href = 'team-assign.html?round=Match-001&new=true';
      }
    }
    
    // 初始化
    updateAuthStatus();
    //setAnnouncementInitialState();
    loadAnnouncements();
  </script>

</body>
</html>
