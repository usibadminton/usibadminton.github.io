<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>裁判記錄單</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-2xl mx-auto p-5">

    <h1 class="text-3xl font-bold text-center mb-6">裁判記錄單</h1>

    <div id="teamName" class="text-xl font-semibold mb-4 text-center text-blue-700"></div>

    <div id="form"></div>

    <button 
        onclick="submitForm()"
        class="w-full mt-6 bg-blue-600 text-white py-3 rounded-lg text-xl font-bold hover:bg-blue-700"
    >
        送出表單
    </button>

</div>

<script>
/* ======================
   1. 從 URL 取得隊伍代號
====================== */
const urlParams = new URLSearchParams(window.location.search);
const team = urlParams.get("team")?.toUpperCase() || "A";
document.getElementById("teamName").innerText = `目前填寫隊伍：${team} 隊`;

/* ======================
   2. Google Sheet 位置
====================== */
const SHEET_ID = "1J5Zr0Sq45Qa7zqWBx3-Pm0ae43CKos5UTtaskYH4J-w";  // 你的試算表 ID
const GID = "1442520714";  // 資料表 gid
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

/* ======================
   3. 局點（你可改成從 Sheet 讀）
====================== */
const rounds = [
    { name: "第 1 點：男雙", id: 1 },
    { name: "第 2 點：女雙", id: 2 },
    { name: "第 3 點：勇壯", id: 3 },
    { name: "第 4 點：混雙", id: 4 },
    { name: "第 5 點：男雙", id: 5 },
];

/* ======================
   4. 從 Google Sheet 載入 Players
====================== */
let players = [];

fetch(CSV_URL)
    .then(res => res.text())
    .then(csv => {
        const rows = csv.split("\n").map(r => r.split(","));

        // L=M=N=O=P → A/B/C/D/E 隊
        const teamIndexMap = { A: 11, B: 12, C: 13, D: 14, E: 15 };

        const colIndex = teamIndexMap[team];  
        if (!colIndex) {
            alert("錯誤：找不到隊伍欄位");
            return;
        }

        // 從 L3:L14 開始 ≈ index 2～13
        for (let i = 2; i <= 13; i++) {
            const value = rows[i]?.[colIndex];
            if (value && value.trim() !== "") {
                players.push(value.trim());
            }
        }

        renderForm();
    });

   5. 動態畫面產生
====================== */

    formDiv.innerHTML = "";
